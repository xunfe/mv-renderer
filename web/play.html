<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="cache-control" content="no-store">
<title>播放 MV · MV渲染器</title>
<style>
  html, body { margin: 0; height: 100%; background: #050607; overflow: hidden; color: #f1ece3; font: 13px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif; }
  #bar {
    position: fixed; left: 0; right: 0; top: 0; z-index: 20; height: 46px; display: flex; align-items: center; gap: 12px;
    padding: 0 14px; background: rgba(8,9,11,.9); border-bottom: 1px solid rgba(255,255,255,.1);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  }
  #back {
    display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 12px 0 9px; border-radius: 999px;
    border: 1px solid rgba(255,255,255,.2); background: rgba(255,255,255,.04); color: #f1ece3; text-decoration: none;
    font-size: 12px; letter-spacing: .03em; flex: none; transition: border-color .15s, color .15s;
  }
  #back:hover { border-color: #ff5a1f; color: #ffb27a; }
  #back .arr { color: #ff7a3a; font-size: 15px; line-height: 1; }
  #title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: "Noto Serif SC", "Songti SC", serif; letter-spacing: .08em; font-size: 14px; }
  #tag { flex: none; font-family: ui-monospace, monospace; font-size: 9.5px; letter-spacing: .14em; color: #ffb27a; border: 1px solid rgba(255,90,31,.45); border-radius: 999px; padding: 3px 8px; }
  #frame { position: fixed; left: 0; right: 0; top: 46px; bottom: 0; width: 100%; height: calc(100% - 46px); border: 0; background: #000; display: block; }
  #hint { position: fixed; left: 50%; top: calc(50% + 23px); transform: translate(-50%,-50%); z-index: 5; color: rgba(241,236,227,.55); font-size: 12px; letter-spacing: .08em; pointer-events: none; }
  #finish {
    position: fixed; left: 50%; bottom: 34px; z-index: 30; transform: translate(-50%,12px); opacity: 0; pointer-events: none;
    display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 13px 24px; border-radius: 16px;
    background: rgba(10,9,8,.9); border: 1px solid rgba(255,255,255,.2); box-shadow: 0 18px 50px rgba(0,0,0,.5);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); transition: opacity .35s, transform .35s; text-align: center;
  }
  #finish.show { opacity: 1; transform: translate(-50%,0); }
  #finish b { font: 600 15px/1.3 "Noto Serif SC","Songti SC",serif; letter-spacing: .12em; color: #ffb27a; }
  #finish span { color: rgba(241,236,227,.6); letter-spacing: .07em; font-size: 11px; }
  #__menubtn { display: none !important; }
</style>
</head>
<body>
<div id="bar">
  <a id="back" href="/home.html"><span class="arr">←</span><span>返回合集</span></a>
  <span id="title">MV</span>
  <span id="tag">IMPORTED</span>
</div>
<iframe id="frame" allow="autoplay; fullscreen; encrypted-media" referrerpolicy="no-referrer"></iframe>
<div id="hint">正在加载…</div>
<div id="finish"><b>已播放完毕</b><span>正在返回合集…</span></div>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var src = q.get('src') || '/home.html';
  var title = q.get('title') || '导入的 MV';
  var back = q.get('back') || '/home.html';
  var frame = document.getElementById('frame');
  var backEl = document.getElementById('back');
  var finished = false, leaving = false;

  try {
    sessionStorage.setItem('mv-return', back);
    sessionStorage.setItem('mv-return-title', '合集');
  } catch (e) {}

  backEl.href = back;
  backEl.innerHTML = '<span class="arr">←</span><span>返回合集</span>';
  document.getElementById('title').textContent = title;
  document.title = title + ' · MV渲染器';

  function goBack() {
    if (leaving) return;
    leaving = true;
    location.href = back;
  }
  function finish(el) {
    if (finished) return;
    try {
      var d = el && isFinite(el.duration) ? el.duration : 0;
      if (d && d < 20) return;
    } catch (e) {}
    finished = true;
    var el = document.getElementById('finish');
    el.classList.add('show');
    setTimeout(goBack, 1000);
  }
  window.__mvFinished = finish;

  function track(el) {
    if (!el || el.__wrapped) return;
    el.__wrapped = 1;
    try { el.addEventListener('ended', function () { finish(el); }); } catch (e) {}
  }
  function scan() {
    var d;
    try { d = frame.contentDocument; } catch (e) { return; }
    if (!d) return;
    document.getElementById('hint').style.display = 'none';
    var list = d.querySelectorAll('audio, video');
    for (var i = 0; i < list.length; i++) {
      track(list[i]);
      if (list[i].ended) finish(list[i]);
    }
    // 兼容动态创建的音频：包装 play()
    try {
      var w = frame.contentWindow;
      var proto = w.HTMLMediaElement && w.HTMLMediaElement.prototype;
      if (proto && proto.play && !proto.play.__wrappedByPlayer) {
        var op = proto.play;
        var np = function () { track(this); return op.apply(this, arguments); };
        np.__wrappedByPlayer = true;
        proto.play = np;
      }
    } catch (e) {}
  }

  frame.addEventListener('load', function () {
    scan();
    setInterval(scan, 900);
  });
  frame.src = src;

  window.addEventListener('message', function (e) {
    var d = e.data;
    if (d === 'mv-ended' || (d && d.type === 'mv-ended')) finish();
  });

  // 兜底：用户手动点返回不受影响；播放器本体的“播完”事件优先
  setTimeout(function () {
    var h = document.getElementById('hint');
    if (h && h.style.display !== 'none') h.textContent = '如果页面一直空白，请返回合集重试';
  }, 12000);
})();
</script>
</body>
</html>
