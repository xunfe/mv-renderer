<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="cache-control" content="no-store">
<title>我只是翻了个身 · 深海版</title>
<style>
  html, body { margin: 0; height: 100%; background: #050b1e; overflow: hidden; }
  #c { display: block; width: 1920px; height: 1080px; }
  body.fit #c { width: 100vw; height: 56.25vw; max-height: 100vh; max-width: 177.78vh; margin: 0 auto; }
  #hud { position: fixed; left: 14px; bottom: 10px; z-index: 3; color: #c9d6f0c0; font: 12px/1.4 ui-sans-serif, system-ui; letter-spacing: .04em; text-shadow: 0 1px 6px #000a; }
  #start {
    position: fixed; inset: 0; z-index: 5; display: grid; place-items: center; cursor: pointer;
    background: radial-gradient(circle at 50% 44%, rgba(255,205,130,.08), rgba(3,6,16,.88));
    color: #f6efe2; transition: opacity .55s ease;
  }
  #start.hide { opacity: 0; pointer-events: none; }
  #start .box { text-align: center; padding: 24px; }
  #start .eyebrow { font: 500 11px/1 ui-monospace, monospace; letter-spacing: .38em; color: #ffc883; margin-bottom: 18px; }
  #start b { display: block; font: 600 clamp(34px, 7vw, 72px)/1.15 "Noto Serif SC", "Noto Serif CJK SC", serif; letter-spacing: .2em; text-indent: .2em; text-shadow: 0 0 50px rgba(255,200,130,.24); }
  #start .line { width: 44px; height: 1px; background: #ffc883; margin: 22px auto; opacity: .85; }
  #start .go { display: inline-flex; align-items: center; gap: 10px; font: 500 13px/1 ui-sans-serif, system-ui; letter-spacing: .16em; color: #f6efe2; border: 1px solid rgba(246,239,226,.34); border-radius: 999px; padding: 12px 22px; }
  #start .go i { width: 0; height: 0; border-left: 9px solid #ffb45e; border-top: 6px solid transparent; border-bottom: 6px solid transparent; display: block; }
  #start small { display: block; margin-top: 16px; font: 400 11px/1.7 ui-sans-serif, system-ui; letter-spacing: .08em; color: rgba(246,239,226,.48); }
  #qbar { position: fixed; right: 14px; top: 14px; z-index: 7; display: flex; align-items: center; gap: 8px; opacity: .8; transition: opacity .3s; }
  #qbar:hover { opacity: 1; }
  #qbar label { font: 500 10px/1 ui-monospace, monospace; letter-spacing: .16em; color: rgba(246,239,226,.55); }
  #q { background: rgba(7,12,30,.72); color: #f6efe2; border: 1px solid rgba(255,255,255,.22); border-radius: 8px; padding: 5px 8px; font: 500 11px/1 ui-sans-serif, system-ui; outline: none; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<div id="hud"></div>
<div id="qbar"><label for="q">画质</label><select id="q" aria-label="画质">
  <option value="1080p60">1080P 60 · 默认</option>
  <option value="4k60">4K 60</option>
  <option value="4k120">4K 120</option>
  <option value="4kmax">4K 不限帧</option>
  <option value="2k30">2K 30</option>
  <option value="1080p30">1080P 30</option>
  <option value="720p30">720P 30</option>
</select></div>
<div id="start" class="mv-start"><div class="box">
  <div class="eyebrow">AI娘角色主题曲MV · 深海版</div>
  <b>我只是翻了个身</b>
  <div class="line"></div>
  <span class="go"><i></i>点击开始</span>
  <small>重绘版 1.0.9：深海夜景 + 白描边大字 + 大立绘，按原版画法重排镜头；人物与音乐仍是小伙伴ko 的原作<br>1:59 · 播放结束自动返回合集</small>
</div></div>
<script>if (!new URLSearchParams(location.search).has('render')) document.body.classList.add('fit');</script>
<script>
/* 安卓 WebView 里 OffscreenCanvas 有时会退化成软件光栅；用普通 canvas 顶上，
   引擎里的临时层/缓存代码不用改。桌面保留原生实现。 */
if (/Android/i.test(navigator.userAgent) && window.OffscreenCanvas) {
  window.OffscreenCanvas = function (w, h) {
    var c = document.createElement('canvas');
    c.width = Math.max(1, Math.ceil(w || 1)); c.height = Math.max(1, Math.ceil(h || 1));
    return c;
  };
}
</script>
<script src="/mv-start.js"></script>
<script src="/mv-return.js"></script>
<script src="/mv-player.js"></script>
<script type="module" src="src/main.js"></script>
<script src="/mv-quality.js"></script>
<script src="/mv-progress.js"></script>
</body>
</html>
